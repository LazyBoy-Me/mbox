name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} out/MBox.apk \;
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBox-apk
          path: out/MBox.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MBox build ${{ github.run_number }}
          body: |
            MBox APK (debug build, unsigned release keystore not needed).

            Built from `${{ github.sha }}` by GitHub Actions.
          files: out/MBox.apk
          fail_on_unmatched_files: true
